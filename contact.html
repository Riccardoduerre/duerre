<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Riccardo Riva</title>
    <meta name="description" content="Get in touch with Riccardo Riva for commercial photography, video production, or creative direction projects.">
    <link rel="canonical" href="https://duerremedia.com/contact.html">
    <link rel="alternate" hreflang="en" href="https://duerremedia.com/en/contact.html">
    <link rel="alternate" hreflang="it" href="https://duerremedia.com/it/contact.html">
    <link rel="alternate" hreflang="x-default" href="https://duerremedia.com/en/contact.html">
    
    <!-- 1. Load Tailwind Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Optimized Tailwind Configurations (Moved right under CDN script) -->
    <script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"], }
                }
            }
        }
    </script>
                }
            }
        }
    </script>
    
    <!-- 3. Typography & Brand Identity Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/Duerre media logo red.png">
    
    <!-- 4. Global Custom Styles Override -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans bg-theme text-theme min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white overflow-x-hidden">

<!-- Header -->
<div id="navbar-container" class="w-full"></div>

<!-- Contact Form Section -->
<main class="flex-grow flex items-center justify-center px-6 py-40">
    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
        
        <div>
            <h2 class="text-xs uppercase tracking-[0.4em] font-bold text-indigo-500 mb-6" data-i18n="Contact">Contact</h2>
            <h1 class="text-4xl md:text-6xl font-bold uppercase mb-10 leading-tight">Let's build your brand's visual identity together.</h1>
            <p class="text-lg text-theme-muted mb-12 max-w-md" data-i18n="contact_intro">Have a project in mind or just want to say hello? I'd love to hear from you.</p>
            
            <div class="space-y-4 text-xs uppercase tracking-widest font-bold">
                <p class="flex items-center space-x-4"><span class="text-indigo-500">Email:</span> <a href="mailto:info@duerremedia.com" class="hover:text-indigo-500 transition-colors">info@duerremedia.com</a></p>
                <p class="flex items-center space-x-4"><span class="text-indigo-500">Location:</span> <span>Italy / Remote</span></p>
            </div>
        </div>

        <div class="bg-theme-surface border border-theme p-10 md:p-12 shadow-2xl">
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-8">
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div>
                    <label for="name" class="block text-[10px] font-bold uppercase tracking-[0.2em] text-theme-muted mb-3" data-i18n="name_label">Full Name</label>
                    <input type="text" id="name" name="name" data-i18n="name_placeholder" required 
                           class="w-full bg-theme border border-theme rounded-sm px-5 py-4 text-theme focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label for="email" class="block text-[10px] font-bold uppercase tracking-[0.2em] text-theme-muted mb-3" data-i18n="email_label">Email Address</label>
                    <input type="email" id="email" name="email" data-i18n="email_placeholder" required 
                           class="w-full bg-theme border border-theme rounded-sm px-5 py-4 text-theme focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label for="message" class="block text-[10px] font-bold uppercase tracking-[0.2em] text-theme-muted mb-3" data-i18n="message_label">Message</label>
                    <textarea id="message" name="message" data-i18n="message_placeholder" required rows="5"
                              class="w-full bg-theme border border-theme rounded-sm px-5 py-4 text-theme focus:outline-none focus:border-indigo-500 transition-all resize-none"></textarea>
                </div>

                <input type="hidden" name="redirect" value="https://duerremedia.com/en/contact.html">

                <button type="submit" class="w-full bg-theme-accent text-white font-bold uppercase tracking-widest text-xs py-5 hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-indigo-500/20" data-i18n="send_button">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<div id="footer-container" class="w-full"></div>

<!-- Scripts -->
<script src="navbar/loadNavbar.js"></script>
<script src="i18n.js"></script>
<script src="js/theme-toggle.js"></script>
</body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Astro Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup GitHub Pages configuration
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies deterministically
        run: npm ci --prefer-offline --no-audit

      - name: Restore Astro & Image Optimization Cache (.astro)
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.astro
          key: ${{ runner.os }}-astro-assets-${{ hashFiles('src/assets/**/*', 'public/uploads/**/*', 'astro.config.mjs', 'src/content.config.ts', 'src/content/**/*.{md,mdx}', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      - name: Validate Content Collections & TypeScript (Strict Check)
        run: npm run typecheck

      - name: Build Astro Production Bundle
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify CNAME and .nojekyll in dist/
        run: |
          touch dist/.nojekyll
          test -f dist/CNAME

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selected Work — Riccardo Riva</title>
    <meta name="description" content="Explore the commercial, editorial, and video portfolio of Riccardo Riva. High-impact visual storytelling and creative direction.">
    <link rel="canonical" href="https://duerremedia.com/portfolio.html">
    <link rel="alternate" hreflang="en" href="https://duerremedia.com/en/portfolio.html">
    <link rel="alternate" hreflang="it" href="https://duerremedia.com/it/portfolio.html">
    <link rel="alternate" hreflang="x-default" href="https://duerremedia.com/en/portfolio.html">
    
    <!-- 1. Load Tailwind Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Global Brand Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"], }
                }
            }
        }
    </script>
    
    <!-- 3. Typography & Brand Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/Duerre media logo red.png">
    
    <!-- 4. Global Custom Styles Override -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans bg-theme text-theme min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">

<div id="navbar-container"></div>

<!-- Portfolio Header -->
<section class="pt-40 pb-16 bg-theme">
    <div class="container mx-auto px-6 md:px-12 text-center">
        <h1 class="text-xs uppercase tracking-[0.4em] font-bold text-indigo-500 mb-6" data-i18n="Portfolio">Work</h1>
        <h2 class="text-4xl md:text-6xl font-bold uppercase mb-12" data-i18n="portfolio_heading">Selected Projects</h2>
        
        <!-- Filter Bar -->
        <div id="filter-bar" class="flex flex-wrap justify-center gap-4 mb-16">
            <button class="filter-btn active" data-category="all" data-i18n="filter_all">All</button>
            <button class="filter-btn" data-category="commercial" data-i18n="filter_commercial">Commercial</button>
            <button class="filter-btn" data-category="portraits" data-i18n="filter_portraits">Portraits</button>
            <button class="filter-btn" data-category="editorial" data-i18n="filter_editorial">Editorial</button>
            <button class="filter-btn" data-category="video" data-i18n="filter_video">Video</button>
        </div>
    </div>
</section>

<!-- Portfolio Grid -->
<section class="pb-24 bg-theme">
    <div class="container mx-auto px-6 md:px-12">
        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-12">
            <!-- Projects injected via JS -->
        </div>
    </div>
</section>

<div id="footer-container"></div>

<!-- Case Study Modal -->
<div id="project-modal" class="modal-overlay">
    <div class="modal-container">
        <!-- Modal content injected via JS -->
    </div>
</div>

<style>
    .filter-btn {
        padding: 0.75rem 1.5rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        border: 1px solid var(--border-color);
        border-radius: 2px;
        transition: all 0.3s ease;
    }
    .filter-btn:hover {
        border-color: #6366f1;
        color: #6366f1;
    }
    .filter-btn.active {
        background-color: #6366f1;
        border-color: #6366f1;
        color: white;
    }
</style>

<script src="js/portfolio-data.js"></script>
<script src="navbar/loadNavbar.js"></script>
<script src="i18n.js"></script>
<script src="js/theme-toggle.js"></script>
<script>
    document.addEventListener('i18nReady', () => {
        const grid = document.getElementById('portfolio-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const modal = document.getElementById('project-modal');
        const modalContainer = modal.querySelector('.modal-container');
        const lang = localStorage.getItem('lang') || 'en';
        let currentCategory = 'all';

        function renderGrid() {
            if (!grid) return;
            grid.innerHTML = '';
            
            const filtered = currentCategory === 'all' 
                ? window.portfolioProjects 
                : window.portfolioProjects.filter(p => p.category === currentCategory);

            filtered.forEach(project => {
                const card = document.createElement('div');
                card.className = 'group cursor-pointer overflow-hidden bg-theme-surface border border-theme';
                card.innerHTML = `
                    <div class="relative aspect-[16/10] overflow-hidden">
                        <img src="${project.image}" alt="${project.title[lang]}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 transform group-hover:scale-105">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                             <span class="px-8 py-4 border border-white text-white uppercase text-xs tracking-[0.2em] font-bold">View Case Study</span>
                        </div>
                    </div>
                    <div class="p-10">
                        <div class="flex justify-between items-start mb-6">
                            <h3 class="text-3xl font-bold uppercase tracking-tight">${project.title[lang]}</h3>
                            <span class="text-[10px] uppercase tracking-[0.2em] font-bold text-indigo-500 px-4 py-1.5 border border-indigo-500/30">${project.category}</span>
                        </div>
                        <p class="text-theme-muted text-lg leading-relaxed mb-8 line-clamp-2">${project.scope[lang]}</p>
                    </div>
                `;
                card.onclick = () => openModal(project);
                grid.appendChild(card);
            });
        }

        async function openModal(project) {
            const translations = await loadTranslations(lang);
            modalContainer.innerHTML = `
                <button class="absolute -top-12 right-0 text-white text-sm uppercase tracking-widest font-bold hover:text-indigo-400 transition-colors" onclick="closeModal()">
                    &times; ${translations['modal_close']}
                </button>
                <div class="flex flex-col lg:flex-row max-h-[90vh]">
                    <div class="w-full lg:w-2/3 bg-black overflow-hidden relative">
                        ${project.videoUrl ? 
                            `<div class="h-full aspect-video"><iframe class="w-full h-full" src="${project.videoUrl}" frameborder="0" allowfullscreen></iframe></div>` :
                            `<div id="modal-gallery" class="h-full flex items-center justify-center relative">
                                <img src="${project.gallery[0]}" class="max-w-full max-h-full object-contain" id="current-slide">
                                ${project.gallery.length > 1 ? `
                                    <button class="absolute left-6 top-1/2 -translate-y-1/2 p-4 text-white/50 hover:text-white text-3xl" onclick="changeSlide(-1, ${JSON.stringify(project.gallery).replace(/"/g, '&quot;')})">&lsaquo;</button>
                                    <button class="absolute right-6 top-1/2 -translate-y-1/2 p-4 text-white/50 hover:text-white text-3xl" onclick="changeSlide(1, ${JSON.stringify(project.gallery).replace(/"/g, '&quot;')})">&rsaquo;</button>
                                ` : ''}
                            </div>`
                        }
                    </div>
                    <div class="w-full lg:w-1/3 p-12 overflow-y-auto bg-theme border-l border-theme flex flex-col justify-between">
                        <div>
                            <h2 class="text-4xl font-bold uppercase mb-3 leading-tight">${project.title[lang]}</h2>
                            <p class="text-indigo-500 font-bold uppercase text-xs tracking-[0.2em] mb-10">${project.scope[lang]}</p>
                            
                            <div class="grid grid-cols-2 gap-8 mb-12 text-[10px] uppercase tracking-[0.2em] font-bold text-theme-muted">
                                <div><span class="block mb-2 text-theme opacity-30">${translations['modal_client']}</span> <span class="text-theme opacity-80">${project.client[lang]}</span></div>
                                <div><span class="block mb-2 text-theme opacity-30">${translations['modal_year']}</span> <span class="text-theme opacity-80">${project.year}</span></div>
                            </div>

                            <div class="space-y-10 text-base leading-relaxed text-theme-muted">
                                <div>
                                    <h3 class="uppercase font-bold tracking-[0.2em] text-[10px] mb-4 text-indigo-500">${translations['modal_challenge']}</h3>
                                    <p>${project.challenge[lang]}</p>
                                </div>
                                <div>
                                    <h3 class="uppercase font-bold tracking-[0.2em] text-[10px] mb-4 text-indigo-500">${translations['modal_solution']}</h3>
                                    <p>${project.solution[lang]}</p>
                                </div>
                            </div>
                        </div>

                        <div class="results-box mt-16">
                            <h3 class="uppercase font-bold tracking-[0.2em] text-[10px] mb-3 opacity-70">${translations['modal_results']}</h3>
                            <p class="font-bold text-xl leading-snug">${project.results[lang]}</p>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = () => {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            modalContainer.innerHTML = '';
        };

        let currentSlideIdx = 0;
        window.changeSlide = (dir, gallery) => {
            currentSlideIdx = (currentSlideIdx + dir + gallery.length) % gallery.length;
            document.getElementById('current-slide').src = gallery[currentSlideIdx];
        };

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderGrid();
            });
        });

        renderGrid();
        window.addEventListener('languageChanged', renderGrid);
    });
</script>
</body>
</html>
